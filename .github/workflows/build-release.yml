name: Build Cryptography 48.0.1 Termux Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Cryptography 48.0.1 inside Termux Docker Container
        run: |
          mkdir -p wheelhouse
          docker run -u root --rm -v $PWD:/workspace -w /workspace termux/termux-docker:latest sh -c "
            export ANDROID_API_LEVEL=24 &&
            pkg update -y &&
            pkg install -y python rust clang libffi openssl patchelf tar &&
            mkdir -p /workspace/build_whl &&
            python3 -m pip install --upgrade pip setuptools wheel setuptools-rust maturin cffi &&
            python3 -m pip wheel --wheel-dir /workspace/build_whl cryptography==48.0.1 cffi &&
            for w in /workspace/build_whl/*.whl; do
              if [ -f \"\$w\" ]; then
                python3 -m wheel tags --platform-tag android_24_arm64_v8a \"\$w\" 2>/dev/null || true
              fi
            done &&
            cp -f /workspace/build_whl/*.whl /workspace/wheelhouse/
          "
          tar -czf cryptography-48.0.1-termux-wheelhouse.tar.gz -C wheelhouse .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cryptography-48.0.1-termux-wheelhouse.tar.gz
            wheelhouse/*.whl
          tag_name: latest
          name: "Cryptography 48.0.1 Termux Wheelhouse Release (Termux Native Container)"
          body: "Pre-compiled cryptography 48.0.1 binary wheels compiled inside termux/termux-docker container on ARM64 for android_24_arm64_v8a / Termux Python 3.14."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
