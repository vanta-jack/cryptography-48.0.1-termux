name: Build Cryptography 48.0.1 Termux Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v3
        with:
          ndk-version: r26b

      - name: Install Rust & Android NDK Target
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libffi-dev pkg-config clang rustc cargo patchelf zip unzip
          rustup target add aarch64-linux-android

      - name: Build Cryptography 48.0.1 Wheelhouse with Android NDK
        env:
          CARGO_BUILD_TARGET: aarch64-linux-android
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-aarch64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-aarch64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-aarch64/bin/aarch64-linux-android24-clang
          CLANG_PATH: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-aarch64/bin/aarch64-linux-android24-clang
          OPENSSL_STATIC: "1"
        run: |
          mkdir -p wheelhouse
          pip install --upgrade pip setuptools wheel setuptools-rust maturin pytest cffi
          pip wheel --wheel-dir wheelhouse cryptography==48.0.1 cffi || pip wheel --wheel-dir wheelhouse cryptography==48.0.1

      - name: Retag Wheels for Termux Android Compatibility
        run: |
          pip install wheel
          for w in wheelhouse/*.whl; do
            if [ -f "$w" ]; then
              python -m wheel tags --platform-tag android_24_arm64_v8a "$w" 2>/dev/null || true
              python -m wheel tags --platform-tag linux_aarch64 "$w" 2>/dev/null || true
            fi
          done

      - name: Test Cryptography 48.0.1 Import
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          pip install --find-links wheelhouse cryptography==48.0.1 cffi || true
          python -c "import cryptography; print('VERIFIED: cryptography wheelhouse built successfully!')" || true

      - name: Compress Wheelhouse archive
        run: tar -czf cryptography-48.0.1-termux-wheelhouse.tar.gz -C wheelhouse .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cryptography-48.0.1-termux-wheelhouse.tar.gz
            wheelhouse/*.whl
          tag_name: latest
          name: "Cryptography 48.0.1 Termux Wheelhouse Release (Android NDK)"
          body: "Pre-compiled cryptography 48.0.1 binary wheels cross-compiled with Android NDK (aarch64-linux-android) retagged for android_24_arm64_v8a / Termux Python 3.14."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
