name: Build Hermes Termux Wheelhouse Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (Matching Termux)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libffi-dev pkg-config clang rustc cargo

      - name: Clone Hermes Agent repository
        run: git clone --depth 1 https://github.com/NousResearch/Hermes-Agent.git hermes

      - name: Build Wheelhouse for Python 3.14
        run: |
          mkdir -p wheelhouse
          pip install --upgrade pip setuptools wheel setuptools-rust maturin
          pip wheel --wheel-dir wheelhouse cryptography==48.0.1
          pip wheel --wheel-dir wheelhouse ./hermes
          pip wheel --wheel-dir wheelhouse -r hermes/requirements.txt || true

      - name: Pre-Deployment Test (Verify Wheelhouse Installation)
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          pip install --no-index --find-links wheelhouse hermes-agent
          python -c "import cryptography; print('VERIFIED: cryptography loaded successfully'); import hermes; print('VERIFIED: hermes loaded successfully')"

      - name: Compress Wheelhouse archive
        run: tar -czf hermes-termux-wheelhouse.tar.gz -C wheelhouse .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-termux-wheelhouse.tar.gz
          tag_name: latest
          name: "Hermes Agent Termux Wheelhouse Latest"
          body: "Automated pre-compiled Python 3.14 binary wheels (including cryptography 48.0.1 and hermes-agent) targeted for Termux / ARM64 Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
