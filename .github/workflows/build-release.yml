name: Build Hermes Termux Wheelhouse Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libffi-dev pkg-config clang rustc cargo

      - name: Clone Hermes Agent repository
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git hermes
          sed -i 's/<3\.14/<3.15/g' hermes/pyproject.toml

      - name: Build Wheelhouse for Python 3.14
        env:
          HERMES_NIX_BUILD: "1"
        run: |
          mkdir -p wheelhouse
          pip install --upgrade pip setuptools wheel setuptools-rust maturin
          pip wheel --wheel-dir wheelhouse cryptography==48.0.1
          pip wheel --wheel-dir wheelhouse -r hermes/requirements.txt || true
          if [ -f hermes/constraints-termux.txt ]; then
            pip wheel --wheel-dir wheelhouse -c hermes/constraints-termux.txt cryptography==48.0.1 || true
          fi
          pip wheel --wheel-dir wheelhouse ./hermes || true

      - name: Retag Wheels for Termux Android Compatibility
        run: |
          pip install wheel
          for w in wheelhouse/*.whl; do
            if [ -f "$w" ]; then
              python -m wheel tags --platform-tag android_24_arm64_v8a "$w" 2>/dev/null || true
              python -m wheel tags --platform-tag linux_aarch64 "$w" 2>/dev/null || true
            fi
          done

      - name: Pre-Deployment Test (Verify Editable Termux Installation on Python 3.14)
        run: |
          python -m venv test_venv
          source test_venv/bin/activate
          pip install --find-links wheelhouse cryptography==48.0.1
          cd hermes
          if [ -f constraints-termux.txt ]; then
            pip install --find-links ../wheelhouse -e '.[termux]' -c constraints-termux.txt || pip install --find-links ../wheelhouse -e '.'
          else
            pip install --find-links ../wheelhouse -e '.'
          fi
          python -c "import cryptography; print('VERIFIED: cryptography loaded successfully'); import hermes_cli; print('VERIFIED: hermes_cli loaded successfully')"
          hermes --help
          cd ..

      - name: Compress Wheelhouse archive
        run: tar -czf hermes-termux-wheelhouse.tar.gz -C wheelhouse .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-termux-wheelhouse.tar.gz
          tag_name: latest
          name: "Hermes Agent Termux Wheelhouse Latest"
          body: "Automated pre-compiled Python 3.14 binary wheels (including cryptography 48.0.1 retagged for android_24_arm64_v8a and hermes-agent dependencies) targeted for Termux / ARM64 Android."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
